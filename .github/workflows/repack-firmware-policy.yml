name: Repack firmware policy
run-name: "Policy ${{ inputs.source_id }} - ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Existing package ID
        required: true
        type: string
      mode:
        description: New distribution mode
        required: true
        type: choice
        options:
          - update
          - emergency
      vin_json:
        description: JSON array of VIN rules
        required: true
        default: '[]'
        type: string
      mac_json:
        description: JSON array of exact MAC addresses
        required: true
        default: '[]'
        type: string
      notes:
        description: Package description
        required: false
        default: ''
        type: string
      audit_note:
        description: Reason recorded in the policy audit trail
        required: false
        default: ''
        type: string
      request_id:
        description: Idempotency key generated by the administrator app
        required: true
        type: string
      disable_source:
        description: Disable the previous policy revision
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: firmware-policy-repack
  cancel-in-progress: false

jobs:
  repack:
    name: Validate, sign and publish
    runs-on: windows-latest
    timeout-minutes: 10
    environment: firmware-signing

    steps:
      - name: Check out the update repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1

      - name: Repack and sign the policy revision
        id: repack
        shell: pwsh
        env:
          SOURCE_ID: ${{ inputs.source_id }}
          POLICY_MODE: ${{ inputs.mode }}
          VIN_JSON: ${{ inputs.vin_json }}
          MAC_JSON: ${{ inputs.mac_json }}
          POLICY_NOTES: ${{ inputs.notes }}
          POLICY_AUDIT_NOTE: ${{ inputs.audit_note }}
          REQUEST_ID: ${{ inputs.request_id }}
          DISABLE_SOURCE: ${{ inputs.disable_source }}
          REQUEST_ACTOR: ${{ github.actor }}
          PRIVATE_KEY_B64: ${{ secrets.KOMA_OTA_PRIVATE_KEY_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_KEY_B64)) {
            throw "Missing KOMA_OTA_PRIVATE_KEY_B64 in firmware-signing environment."
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "koma-signing-key.b64"
          $resultPath = Join-Path $env:RUNNER_TEMP "policy-result.json"
          try {
            [IO.File]::WriteAllText(
              $keyPath,
              $env:PRIVATE_KEY_B64,
              (New-Object Text.UTF8Encoding($false))
            )
            & ./tools/repack_firmware_policy.ps1 `
              -SourceId $env:SOURCE_ID `
              -Mode $env:POLICY_MODE `
              -VinJson $env:VIN_JSON `
              -MacJson $env:MAC_JSON `
              -Notes $env:POLICY_NOTES `
              -AuditNote $env:POLICY_AUDIT_NOTE `
              -RequestId $env:REQUEST_ID `
              -Actor $env:REQUEST_ACTOR `
              -DisableSource $env:DISABLE_SOURCE `
              -PrivateKeyPath $keyPath `
              -ResultPath $resultPath | Out-Host

            $result = Get-Content -Raw -LiteralPath $resultPath | ConvertFrom-Json
            "package_id=$($result.packageId)" >> $env:GITHUB_OUTPUT
            "policy_revision=$($result.policyRevision)" >> $env:GITHUB_OUTPUT
            "idempotent=$($result.idempotent.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "relative_path=$($result.relativePath)" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $resultPath -Force -ErrorAction SilentlyContinue
          }

      - name: Validate repository changes
        if: steps.repack.outputs.idempotent != 'true'
        shell: pwsh
        run: |
          git diff --check
          $changes = @(git status --short)
          if ($changes.Count -lt 2) {
            throw "Expected a new KFW package and a manifest update."
          }
          if ($changes | Where-Object {
              $_ -notmatch 'manifest\.json$' -and
              $_ -notmatch '^..\s+firmware/'
            }) {
            throw "Workflow generated an unexpected repository change."
          }

      - name: Commit the signed package and manifest
        if: steps.repack.outputs.idempotent != 'true'
        shell: pwsh
        env:
          PACKAGE_ID: ${{ steps.repack.outputs.package_id }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "koma-firmware-bot"
          git config user.email "koma-firmware-bot@users.noreply.github.com"
          git add -- manifest.json firmware
          git commit -m "Publish policy revision for $env:PACKAGE_ID" `
            -m "Requested by $env:REQUEST_ACTOR through the administrator workflow."
          git push origin HEAD:main

      - name: Write operation summary
        if: always()
        shell: pwsh
        env:
          PACKAGE_ID: ${{ steps.repack.outputs.package_id }}
          POLICY_REVISION: ${{ steps.repack.outputs.policy_revision }}
          IDEMPOTENT: ${{ steps.repack.outputs.idempotent }}
          SOURCE_ID: ${{ inputs.source_id }}
          POLICY_MODE: ${{ inputs.mode }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          @"
          ## Firmware policy operation

          - Source: ``$env:SOURCE_ID``
          - New package: ``$env:PACKAGE_ID``
          - Mode: ``$env:POLICY_MODE``
          - Policy revision: ``$env:POLICY_REVISION``
          - Request ID: ``$env:REQUEST_ID``
          - Idempotent replay: ``$env:IDEMPOTENT``
          "@ >> $env:GITHUB_STEP_SUMMARY
