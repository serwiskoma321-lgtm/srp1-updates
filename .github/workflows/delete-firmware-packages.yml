name: Delete firmware packages
run-name: "Delete firmware batch - ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      package_ids_json:
        description: JSON array of exact manifest package IDs
        required: true
        type: string
      audit_note:
        description: Reason recorded in the deletion audit trail
        required: false
        default: ''
        type: string
      request_id:
        description: Idempotency key generated by the administrator app
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: firmware-package-delete
  cancel-in-progress: false

jobs:
  delete:
    name: Validate and delete packages
    runs-on: windows-latest
    timeout-minutes: 5
    environment: firmware-signing

    steps:
      - name: Check out the update repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1

      - name: Remove packages and update audit trail
        id: delete
        shell: pwsh
        env:
          PACKAGE_IDS_JSON: ${{ inputs.package_ids_json }}
          AUDIT_NOTE: ${{ inputs.audit_note }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP "delete-batch-result.json"
          try {
            & ./tools/delete_firmware_packages.ps1 `
              -PackageIdsJson $env:PACKAGE_IDS_JSON `
              -AuditNote $env:AUDIT_NOTE `
              -RequestId $env:REQUEST_ID `
              -Actor $env:REQUEST_ACTOR `
              -ResultPath $resultPath | Out-Host

            $result = Get-Content -Raw -LiteralPath $resultPath | ConvertFrom-Json
            "idempotent=$($result.idempotent.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            "deleted_count=$($result.deletedCount)" >> $env:GITHUB_OUTPUT
          } finally {
            Remove-Item -LiteralPath $resultPath -Force -ErrorAction SilentlyContinue
          }

      - name: Validate repository changes
        if: steps.delete.outputs.idempotent != 'true'
        shell: pwsh
        run: |
          git diff --check
          $changes = @(git status --short)
          if ($changes.Count -lt 1) {
            throw "Expected a manifest update."
          }
          if ($changes | Where-Object {
              $_ -notmatch 'manifest\.json$' -and
              $_ -notmatch '^.D\s+firmware/'
            }) {
            throw "Workflow generated an unexpected repository change."
          }

      - name: Commit manifest and package deletions
        if: steps.delete.outputs.idempotent != 'true'
        shell: pwsh
        env:
          DELETED_COUNT: ${{ steps.delete.outputs.deleted_count }}
          REQUEST_ACTOR: ${{ github.actor }}
        run: |
          git config user.name "koma-firmware-bot"
          git config user.email "koma-firmware-bot@users.noreply.github.com"
          git add -- manifest.json firmware
          git commit -m "Delete $env:DELETED_COUNT firmware packages" `
            -m "Requested by $env:REQUEST_ACTOR through the administrator workflow."
          git push origin HEAD:main
